name: gatk-4.2.6.1
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - gatk4=4.2.6.1
  # GATK 4.2 needs Java 8: its Spark (used by CreateReadCountPanelOfNormals)
  # fails under Java 11 with "Unsupported class file major version 55"
  - openjdk=8
  - samtools=1.15
  - bedtools=2.30.0
