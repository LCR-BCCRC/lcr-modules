lcr-modules:

    mhc_hammer:

        inputs:
            # Available wildcards: {seq_type} {genome_build} {sample_id}
            sample_bam: "__UPDATE__"
            sample_bai: "__UPDATE__"

            # VEP's annotation cache directory (reference data VEP reads from, not a tool/script
            # location -- vep_path below, the directory containing the vep executable itself,
            # stays under options, matching vcf2maf's own inputs.vep_cache / options.vep_path
            # split for this exact same tool).
            # TEMPORARY for testing -- revert to "__UPDATE__" before merging.
            vep_cache: "/projects/rmorin/reference/ensembl_vep_cache/" # VEP cache directory, passed as --dir_cache

            # Any complete human reference genome FASTA (does NOT need to match any sample's
            # genome_build -- used only to identify which of the IMGT-derived kmers below are
            # non-specific/repetitive genome-wide, so the same filtered kmer set is deliberately
            # reused across all builds for consistency). Not conda-installable (a full reference
            # genome download); reference data, same category as vep_cache above.
            # TEMPORARY for testing -- revert to "__UPDATE__" before merging.
            reference_genome_fasta: "reference/genomes/grch37/genome_fasta/genome.fa"

            # Optional path to Battenberg's own per-pair cellularity_ploidy.txt output
            # (tab-separated, header row, "cellularity" and "ploidy" columns -- same file
            # modules/cnaqc/1.0 already consumes). Available wildcards: {seq_type} {genome_build}
            # {tumour_id} {normal_id}. Pairs missing this file (or left as "") are skipped for
            # copy-number output only (allelic-imbalance/mutation calling are unaffected) --
            # deliberately not "__UPDATE__" since this option is optional, not required. Under
            # inputs (not options) since it's reference *data* the module reads, same category as
            # vep_cache/reference_genome_fasta above -- moved here from options (2026-08-26) after
            # the inputs/options split for this exact option caused two real, separate bugs in one
            # afternoon (a wrapper script's own config-mutation code targeting the wrong section,
            # then a user's own config YAML doing the same) -- see project memory for the full
            # story if this decision ever needs revisiting.
            # TEMPORARY for testing -- revert to "" before merging.
            battenberg_cellularity_ploidy: "results/battenberg-1.2/02-battenberg/{seq_type}--{genome_build}/{tumour_id}--{normal_id}/{tumour_id}_cellularity_ploidy.txt"

        scratch_subdirectories: []

        options:
            # Path to a directory containing the novoalign/novoindex binaries (Novoalign V3.x;
            # only V3 and earlier are free for non-commercial/academic use). Not conda-installable
            # (manually licensed download from novocraft.com) -- see module README.
            # TEMPORARY for testing -- revert to "__UPDATE__" before merging.
            novoalign_dir: "/home/rmorin/miniconda3/envs/novoalign_3/bin/"

            # Path to an installed HLA-HD directory (must contain bin/, dictionary/, freq_data/,
            # HLA_gene.split.txt). Not conda-installable (registration-gated download) -- see
            # module README. The HLA-HD database version must match `imgt_release` below.
            # TEMPORARY for testing -- revert to "__UPDATE__" before merging.
            hlahd_dir: "/home/rmorin/hlahd.1.7.1/"

            # Path to your own separately-obtained, personally-licensed clone of
            # github.com/McGranahanLab/mhc-hammer. MHC Hammer is distributed under a Cancer
            # Research Horizons academic-use licence that prohibits redistribution -- this
            # module therefore never bundles its bin/*.R or bin/*.sh scripts and instead calls
            # them from this user-supplied path. See module README before setting this.
            # TEMPORARY for testing -- revert to "__UPDATE__" before merging.
            mhc_hammer_scripts_dir: "/projects/rmorin/rmorin_git/mhc-hammer/"

            # VEP is user-supplied (not conda-installed) to avoid the bioconda/Perl solver
            # conflicts already hit with ensembl-vep in the vcf2maf module. Mirrors vcf2maf's
            # own vep_path/vep_cache split -- vep_path is a tool/executable location (stays here
            # under options), vep_cache is reference data VEP reads from (moved to inputs above).
            # TEMPORARY for testing -- revert to "" before merging.
            vep_path: "/projects/rmorin_scratch/conda_environments/f816977f06ed42b54bf471f1bb26c3b0_/bin" # Path to directory containing vep executable; auto-detected from PATH if empty

            # Kmers occurring more than this many times genome-wide (per inputs.reference_genome_fasta)
            # are dropped before BAM subsetting -- see _mhc_hammer_filter_kmers. Starting default;
            # intended to be tuned by inspecting the actual genome-wide occurrence distribution
            # (a kmer truly specific to HLA-A/B/C should occur only a handful of times genome-wide;
            # repetitive-element-contaminated kmers tend to occur many orders of magnitude more).
            kmer_max_genome_occurrences: 50

            # Pins which IMGT-derived MHC Hammer reference bundle is downloaded from Zenodo
            # (two separate zip files per release: mhc_references.zip + kmer_files.zip).
            # Must match the IMGT/HLA-HD database version used by `hlahd_dir` above.
            imgt_release: "3.55"
            imgt_release_urls:
                "3.38":
                    mhc_references: "https://zenodo.org/records/11059410/files/mhc_references.zip?download=1"
                    kmer_files: "https://zenodo.org/records/11059410/files/kmer_files.zip?download=1"
                "3.55":
                    mhc_references: "https://zenodo.org/records/12606532/files/mhc_references.zip?download=1"
                    kmer_files: "https://zenodo.org/records/12606532/files/kmer_files.zip?download=1"

            # Region carrying the classical HLA class I locus. A real meta-analysis cohort ends up
            # with many reference "flavours" of what's fundamentally the same two coordinate
            # systems (grch37, grch37-noalt, grch37_masked, hs37d5, hg19, hg19-clc, hg19-clc-other,
            # hg19-karsan, hg19-reddy, hg19_masked, ... vs. grch38, grch38-legacy, grch38-nci, hg38,
            # hg38-nci, hg38-panea, hg38_masked, hg38_mask_parY, ... -- 18+ observed builds and
            # counting) that only ever differ from each other in naming/masking/patch/decoy details
            # irrelevant to HLA coordinates -- so this is regex-pattern-based (mhc_build_
            # coordinate_system_patterns, matched against the raw genome_build string via
            # re.search() in mhc_hammer.smk) rather than one full region string per literal build
            # name (that grew unmanageable almost immediately -- confirmed via a real run,
            # 2026-08-02: KeyError: 'hs37d5' the first time this module saw a "genome"/WGS build
            # distinct from "capture"'s "grch37"). Patterns are tried in order, first match wins;
            # add a new pattern (not a new per-build entry) if a future genome_build value doesn't
            # match either existing one -- "37|19" and "38" cover every build observed so far.
            #
            # The chr-prefix ("chr6" vs "6") is NOT configured here at all -- deliberately not a
            # third regex-pattern axis, since it's directly, reliably readable from each sample's
            # own BAM header at runtime (_mhc_hammer_subset_bam checks for an "SN:chr6" @SQ entry),
            # which is strictly more trustworthy than inferring it from a naming convention that
            # could be wrong for some flavour never yet seen -- name-based guessing would fail
            # silently (a samtools region query against a mismatched contig name just returns zero
            # reads, not an error), so ground truth beats inference wherever ground truth is cheap
            # to check.
            mhc_build_coordinate_system_patterns:
                "37|19": "hg19"
                "38": "hg38"

            # Canonical per-coordinate-system HLA class I region, no chr-prefix (added at runtime
            # -- see above). Padded ~200-300kb around real HLA-A/B/C gene coordinates (Ensembl
            # GRCh37/GRCh38, confirmed via rest.ensembl.org and grch37.rest.ensembl.org
            # 2026-07-31: GRCh37 HLA-A 29909037-29913661, HLA-B 31321649-31324965, HLA-C
            # 31236526-31239907; GRCh38 HLA-A 29941260-29949606, HLA-B 31353195-31367067, HLA-C
            # 31268746-31272171), rather than the whole ~171Mb chromosome 6 used previously --
            # real-run evidence (2026-07-31, a GAMBL/ICGC-DART sample) showed the whole-chromosome
            # region extracting 3.67M reads of which only ~2000-2600 were actually at the true
            # HLA-A/B/C loci, and HLA-HD's own internal allele-narrowing algorithm found zero
            # informative patterns despite that being perfectly adequate depth on its own --
            # consistent with the true signal being overwhelmed by ~1800x as much irrelevant
            # chromosome-6 volume. Kmer-fishing (see fish_reads below) is a separate mechanism
            # (catches reads that misalign elsewhere in the genome) and not a backstop for reads
            # clipped at a too-tight region boundary, so this still pads generously rather than
            # using tight gene-only boundaries.
            mhc_coords_by_system:
                hg19: "6:29700000-31600000"
                hg38: "6:29750000-31650000"

            # HLA class II germline typing -- a deliberately separate, parallel path alongside the
            # class I disruption-detection pipeline above (subset -> fastq -> HLA-HD typing only;
            # no personalised reference, novoalign, CN/AIB, or mutation calling -- that's left for
            # a possible future extension, not built here). Reuses the same
            # mhc_build_coordinate_system_patterns above (that classification is generic to any
            # locus on chr6, not specific to the class I genes) but needs its own region and gene
            # list, since the classical class II genes sit ~1Mb away from HLA-A/B/C. Coordinates
            # confirmed via rest.ensembl.org/grch37.rest.ensembl.org 2026-08-10: GRCh37 spans
            # HLA-DRA (32407619-32412823) through HLA-DPB1 (33043703-33054978), ~200kb padding on
            # each side; GRCh38 spans HLA-DRB1 (32577902-32589848) through HLA-DPB1
            # (33073786-33091655), same padding. The haplotype-dependent DRB3/DRB4/DRB5 genes and
            # the non-classical DMA/DMB/DOA/DOB genes all fall within this same window (confirmed
            # individually) -- only one region is needed, not one per gene.
            hla2_coords_by_system:
                hg19: "6:32350000-33250000"
                hg38: "6:32380000-33300000"

            # Classical peptide-presenting HLA class II genes (DRA + every functional DRB locus +
            # DQ/DP heterodimers) plus the non-classical peptide-loading/editing genes HLA-DM/-DO.
            # Deliberately excludes the DRB pseudogenes (DRB2, DRB6, DRB7, DRB8, DRB9) that HLA-HD
            # can also type -- those aren't translated into functional, peptide-presenting protein.
            hla2_genes:
                - "DRA"
                - "DRB1"
                - "DRB3"
                - "DRB4"
                - "DRB5"
                - "DQA1"
                - "DQB1"
                - "DPA1"
                - "DPB1"
                - "DMA"
                - "DMB"
                - "DOA"
                - "DOB"

            # Module-owned (not MHC Hammer's own bin/) -- see the long comment at the top of
            # src/parse_hlahd_output.R for why this exists separately from upstream's
            # hlahd_parse_output.R.
            hla2_parse_script: "{MODSDIR}/src/parse_hlahd_output.R"

            # Module-owned (not MHC Hammer's own bin/) -- reformats _mhc_hammer_parse_mutations's
            # own {patient_id}_mutations.csv into a MAF-like table for tools that expect MAF input
            # (e.g. maftools) but don't need real genomic coordinates. See the header comment in
            # src/mutations_to_maf.R for why Chromosome/Start_Position/End_Position are synthetic.
            mutations_to_maf_script: "{MODSDIR}/src/mutations_to_maf.R"

            # BAM subsetting (preprocessing). Setting fish_reads to False also skips the entire
            # genome-wide kmer index build + filter step (_mhc_hammer_build_genome_kmer_index /
            # _mhc_hammer_filter_kmers) as a real Snakemake dependency, not just the internal
            # subset_bam_opt.sh flag -- useful to disable for fast iteration during testing, since
            # that whole-genome jellyfish build+dump is the slowest one-time step in this module.
            fish_reads: True
            unmapped_reads: True
            # Per-genome_build, NOT per-seq_type -- seq_type (capture/genome) and genome_build
            # (grch37/hs37d5/hg38) aren't consistently paired in real cohorts (e.g. a capture
            # sample can be aligned to hs37d5 same as a genome/WGS sample), but whether
            # contig_reads is worth its cost depends entirely on the *build*: it exists to rescue
            # reads that misalign to HLA-specific ALT contigs, which only exist on GRCh38-style
            # builds (e.g. chr6_GL*_alt). GRCh37-style builds (grch37, hs37d5) have no HLA-specific
            # ALTs -- their "non-standard contigs" are generic, unrelated decoy/unplaced sequences,
            # so contig_reads there rescues ~nothing HLA-relevant while costing enormously more
            # novoalign time. Confirmed on a real GAMBL run (2026-08-05): with contig_reads: True
            # on hs37d5, 96.8% of the entire subsetted BAM (46.2M of 47.7M reads) came from
            # non-standard contigs -- 82.8% from the hs37d5 decoy contig alone (not the genome
            # build, the actual decoy sequence inside it, confusingly sharing the same name) and
            # 14.0% from ~200 small GL000xxx alt/decoy contigs -- vs. only 3.2% (1.52M reads) from
            # the actually-targeted hla_region + unmapped_reads categories. That 31x read-count
            # inflation was the direct cause of novoalign taking 3+ hours (and counting) on a
            # single WGS sample. Add further genome_build entries here (e.g. grch38/hg19) as
            # needed; anything not listed falls back to True (the original, upstream-matching
            # default) via CFG["options"]["contig_reads"].get(genome_build, True) at the call site.
            contig_reads:
                grch37: False
                hs37d5: False
                hg38: True

            # Debug-only: HLA-HD's own exon/intron/mapfile/maplist intermediates (its actual
            # per-exon/intron bowtie2 SAM alignments against its internal dictionaries) are
            # normally deleted after each run, matching upstream's own "remove high mem
            # intermediate files" step -- these can be many GB per patient. Set to True
            # temporarily to keep them for inspection (e.g. when HLA-HD types nothing and
            # aggregate read counts alone aren't enough to diagnose why); set back to False
            # once done, since normal runs shouldn't accumulate this.
            keep_hlahd_intermediates: False

            # Passed to hlahd.sh's own -m flag: "A read whose length is shorter than this
            # parameter is ignored" (HLA-HD's own documentation, w3.genome.med.kyoto-u.ac.jp/HLA-HD).
            # HLA-HD's own default is 100 -- fine for 100bp+ reads, but silently discards *every*
            # read (and therefore types nothing, with no clear error pointing back to this) for
            # shorter-read data. Real-run evidence (2026-07-31): a GAMBL/ICGC-DART sample with
            # 75bp reads typed zero alleles for A/B/C with confusing, hard-to-trace symptoms
            # (empty intermediate FASTQs several stages downstream, "Unable to read file magic
            # number", missing pickup.sh) that all traced back to this one flag once found in
            # HLA-HD's own demo manual (hlahd-demo.v1.pdf) and confirmed against its documented
            # -m description; a same-pipeline 101bp-read sample (TCRBOA7) worked fine since 101 >
            # 100. Set below 100 here (75) so shorter-read cohorts don't hit this by default --
            # if your cohort's reads are shorter than this value, lower it to match (should be
            # at or below the true read length; exactly matching wastes nothing since -m is a
            # lower bound, not an exact-length requirement).
            hlahd_min_read_length: 75

            # Allele BAM filtering
            max_mismatch: 1

            # DNA allelic imbalance / copy number. Minimum GERMLINE depth (strictly greater than)
            # for a position to be used as one of the many allele-differentiating SNP positions
            # get_cn.R/get_logr_aib.R aggregate (median + t-test CI) into a copy number/AIB call --
            # see bin/get_filtered_pos_bed.R (`coverage_dt[depth > min_depth]`). 30 is upstream's
            # own default (nextflow.config), clearly tuned for WES's on-target enrichment
            # (typically 100-300x+). WGS has no such enrichment -- confirmed on a real GAMBL run
            # (2026-08-04/05): a WGS germline sample's depth at a personalized HLA-A allele
            # reference had mean 6.3x / max 17x, so *zero* positions ever passed depth > 30,
            # leaving n_snps == 0 and every downstream CN/AIB column blank -- not a bug, upstream's
            # own docs/README state MHC Hammer requires WES ("MHC Hammer requires every patient to
            # have a whole exome sequencing (WES) germline blood sample"), and no evidence was
            # found of anyone running it on WGS successfully. Per-seq_type since capture (WES) and
            # genome (WGS) samples can coexist in the same cohort and need very different
            # thresholds; keyed by seq_type (not genome_build, unlike mhc_coords) since that's what
            # actually drives the depth difference. genome: 5 is a starting point, not a validated
            # value -- get_cn.R/get_logr_aib.R aggregate median BAF/logR + a t-test CI across every
            # SNP that passes this filter, so (unlike a simple presence/absence check) a lower bar
            # here is expected to let real signal through via that aggregation, not just noise; how
            # many SNPs actually survive per gene at this value, and how tight the resulting CI is,
            # should be checked empirically before trusting genome-seq_type CN/AIB calls the same
            # way as capture's.
            min_depth:
                capture: 30
                genome: 5

            # Cohort table QC thresholds (docs/mhc_hammer_outputs.md upstream)
            min_number_of_snps: 10
            max_copy_number_range: 2.5
            min_expected_depth: 10
            # These two are RNA-specific QC thresholds, but make_cohort_overview_table.R marks
            # them required=TRUE even when no RNA data is present (DNA-only v1) -- upstream
            # defaults, confirmed by reading nextflow.config.
            min_frac_mapping_uniquely: 0.5
            max_frac_mapping_multi_gene: 0.05

        conda_envs:
            samtools: "{MODSDIR}/envs/samtools.yaml"
            mhc_hammer_download: "{MODSDIR}/envs/mhc_hammer_download.yaml"
            mosdepth: "{MODSDIR}/envs/mosdepth.yaml"
            mhc_hammer_r: "{MODSDIR}/envs/mhc_hammer_r.yaml"
            mhc_hammer_hlahd: "{MODSDIR}/envs/mhc_hammer_hlahd.yaml"
            mhc_hammer_reference: "{MODSDIR}/envs/mhc_hammer_reference.yaml"
            mhc_hammer_alignment: "{MODSDIR}/envs/mhc_hammer_alignment.yaml"
            mhc_hammer_cn_aib: "{MODSDIR}/envs/mhc_hammer_cn_aib.yaml"
            mhc_hammer_detect_muts: "{MODSDIR}/envs/mhc_hammer_detect_muts.yaml" # gatk4/bcftools/tabix only, no VEP
            jellyfish: "{MODSDIR}/envs/jellyfish.yaml"

        container_envs:
            samtools: null
            mhc_hammer_download: null
            mosdepth: null
            jellyfish: null
            # Every rule that calls a script from mhc_hammer_scripts_dir, novoalign_dir,
            # hlahd_dir, or vep_path sets `container: None` directly in the rule (that's most
            # rules in this module -- subset_bam, hlahd, generate_references, novoalign,
            # make_allele_bams, detect_cn_aib, detect_muts, parse_mutations, cohort_table).
            # Those are all host filesystem paths outside this module's control that can't be
            # guaranteed to exist/be bind-mounted inside a container image.

        threads:
            download_reference: 1
            build_genome_kmer_index: 8
            filter_kmers: 4
            build_ref_cache: 1
            flagstat: 4
            subset_bam: 8
            generate_fqs: 4
            hlahd: 4
            generate_references: 1
            novoalign: 1 # unlicensed Novoalign is single-threaded only
            novoalign_postprocess: 4 # sort/filter/index -- split from novoalign so this can use more threads than novoalign itself can
            make_allele_bams: 1
            mosdepth: 4
            detect_cn_aib: 1
            detect_muts: 1
            parse_mutations: 1
            mutations_to_maf: 1
            cohort_table: 1
            # HLA class II germline typing (separate, parallel path -- see options.hla2_genes)
            hla2_subset_bam: 8
            hla2_generate_fqs: 4
            hla2_hlahd: 4

        resources:
            download_reference:
                mem_mb: 1000
            # Whole-genome 30-mer counting is memory-hungry (non-canonical, so effectively one
            # hash entry per distinct 30-mer actually observed in the reference -- easily >1e9
            # for a full human genome). Starting default; may need tuning per system.
            build_genome_kmer_index:
                mem_mb: 32000
            filter_kmers:
                mem_mb: 4000
            build_ref_cache:
                mem_mb: 2000
            flagstat:
                mem_mb: 4000
            subset_bam:
                mem_mb: 8000
            generate_fqs:
                mem_mb: 4000
            hlahd:
                mem_mb: 16000
            generate_references:
                mem_mb: 4000
            novoalign:
                mem_mb: 8000
            novoalign_postprocess:
                mem_mb: 8000
            make_allele_bams:
                mem_mb: 4000
            mosdepth:
                mem_mb: 2000
            detect_cn_aib:
                mem_mb: 4000
            detect_muts:
                mem_mb: 8000
            parse_mutations:
                mem_mb: 2000
            mutations_to_maf:
                mem_mb: 2000
            cohort_table:
                mem_mb: 4000
            hla2_subset_bam:
                mem_mb: 8000
            hla2_generate_fqs:
                mem_mb: 4000
            # Same footprint as class I hlahd -- typing 13 genes instead of 3 makes this take
            # longer (HLA-HD types genes sequentially), not meaningfully more memory-hungry.
            hla2_hlahd:
                mem_mb: 16000

        pairing_config:
            capture:
                run_paired_tumours: True
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: False
            genome:
                run_paired_tumours: True
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: False
