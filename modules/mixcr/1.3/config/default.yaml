lcr-modules:

    mixcr:

        dirs:
            _parent: "__UPDATE__"

        inputs:
            # Available wildcards: {seq_type} {sample_id}
            sample_fastq_1: "__UPDATE__"
            sample_fastq_2: "__UPDATE__"
            # Directory where MiXCR 4.x is installed (bin/mixcr launcher)
            mixcr_exec: "__UPDATE__"
            # MiLaboratories license file (4.x requires one); never committed
            mixcr_license: "__UPDATE__"

        scratch_subdirectories: []

        receptors: "__UPDATE__"
        ###### Desired IG/TCR chains in list format or keyword:
        ###### "ALL" = ['IGH', 'IGL', 'IGK', 'TRA', 'TRB', 'TRD', 'TRG']
        ###### "BCR" = ['IGH', 'IGL', 'IGK']
        ###### "TCR" = ['TRA', 'TRB', 'TRD', 'TRG']

        options:
            mixcr_version: "4.7.0"
            # analyze preset per seq_type. MiXCR 4.7 bulk RNA-seq preset = "rna-seq"
            # (<=4.6 was "rnaseq-full-length").
            analyze:
                mrna: "rna-seq --species hsa"
            # exportClones fields. vIdentityPercents / nMutations / mutationsDetailed are
            # MiXCR's native SHM measures (IgBLAST reannotation was removed - see CHANGELOG).
            # VALIDATE flag names against `mixcr exportClones --help` of the installed 4.x.
            export_clones: >-
                -cloneId -readCount -readFraction
                -nFeature FR1 -nFeature CDR1 -nFeature FR2 -nFeature CDR2 -nFeature FR3 -nFeature CDR3 -nFeature FR4
                -aaFeature FR1 -aaFeature CDR1 -aaFeature FR2 -aaFeature CDR2 -aaFeature FR3 -aaFeature CDR3 -aaFeature FR4
                -vHit -dHit -jHit -vHitsWithScore
                -vIdentityPercents -nMutations VRegion -aaMutations VRegion -mutationsDetailed VRegion
                -isProductive VRegion

        conda_envs:
            java: "{MODSDIR}/envs/java-jdk-17.yaml"

        # For --use-singularity. MiXCR 4.7 needs Java 17 (the downloaded binary runs
        # inside this JRE); mixcr/1.2's java-jdk:8 biocontainer is too old for 4.x.
        container_envs:
            java: "docker://eclipse-temurin:17-jre"

        threads:
            mixcr_run: 4

        resources:
            mixcr_run:
                mem_mb: 10000
                fastq: 1

        pairing_config:
            mrna:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
