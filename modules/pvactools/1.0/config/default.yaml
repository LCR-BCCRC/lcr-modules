lcr-modules:

    pvactools:

        inputs:
            # Required, per matched pair. This module has no variant source of its own, by design:
            # it reads whatever vcf2maf's own deployment is already configured with, so it never
            # cares which caller (SAGE, Strelka, Mutect2, ...) actually produced the calls -- that
            # question is already solved once, upstream, by vcf2maf's own generic
            # inputs.sample_vcf_gz. Point these at the SAME vcf2maf-1.3 deployment your project
            # already uses (same _parent / vcf_base_name / filter / target_build choices) --
            # <parent>/<base_name>/<filter>/<target_build> below are literal strings you fill in to
            # match that deployment, not module wildcards.
            # Real path confirmed by reading modules/vcf2maf/1.3/vcf2maf.smk directly:
            # _vcf2maf_input_vcf's own tracked, symlinked copy of the raw caller VCF.
            # Available wildcards: {seq_type} {genome_build} {tumour_id} {normal_id} {pair_status}
            # results/unix_group to be prepended to this in snakefile
            vcf2maf_raw_vcf: "slms_3-1.0_vcf2maf-1.3/00-inputs/{seq_type}--{genome_build}/{tumour_id}--{normal_id}--{pair_status}/slms-3.final.vcf.gz"

            # Required, per matched pair. vcf2maf's own ORIGINAL (not CrossMap-projected) MAF --
            # _vcf2maf_output_original, NOT _vcf2maf_output_maf. This matters for correctness, not
            # just convention: _vcf2maf_output_maf's own path is CrossMap-projected onto a single
            # cohort-wide target_build, so its coordinates are in a DIFFERENT build than the raw VCF
            # for any sample whose own native genome_build doesn't match that target -- silently
            # wrong position-matching against vcf2maf_raw_vcf above for those samples.
            # _vcf2maf_output_original stays in the sample's own native {genome_build} the whole
            # way through (confirmed by reading modules/vcf2maf/1.3/vcf2maf.smk directly: its own
            # output path is keyed on {genome_build}, with no {target_build}/projection involved at
            # all), matching vcf2maf_raw_vcf's own coordinate system exactly. Its
            # Variant_Classification column (already computed by vcf2maf's own earlier VEP run) is
            # used to subset vcf2maf_raw_vcf above down to only protein-altering positions before
            # this module's own VEP+Frameshift+Wildtype annotation (see
            # options.coding_variant_classifications below and _pvactools_subset_to_coding_variants
            # in pvactools.smk). <filter> is "raw" or "deblacklisted", <maf> is "maf" or
            # "augmented_maf", per your vcf2maf deployment's own options.filter/options.augment.
            # results/unix_group to be prepended to this in snakefile
            vcf2maf_maf: "slms_3-1.0_vcf2maf-1.3/99-outputs/deblacklisted/maf/{seq_type}--{genome_build}/{tumour_id}--{normal_id}--{pair_status}.slms-3.final.maf"

            # Required, per patient (not per pair -- HLA typing is germline, shared across a
            # patient's samples). modules/mhc_hammer/1.0's own consolidated HLA-HD Class I result
            # (_mhc_hammer_output_hla_final_result). Class I typing lives entirely here rather than
            # LILAC -- keeps this module to a single upstream typing source (mhc_hammer already
            # produces both classes). Resolved from {tumour_id}/{seq_type} via CFG["runs"], mirroring
            # mhc_hammer's own _mhc_hammer_get_patient_id_for_tumour helper.
            # results/unix_group to be prepended to this in snakefile
            hla_alleles: "mhc_hammer-1.0/99-outputs/hla_alleles/{seq_type}--{genome_build}/{patient_id}.hla_alleles.txt"

            # Optional, per patient (not per pair -- HLA typing is germline, shared across a
            # patient's samples). modules/mhc_hammer/1.0's own class II HLA-HD typing output.
            # Resolved from {tumour_id}/{seq_type} via CFG["runs"], mirroring mhc_hammer's own
            # _mhc_hammer_get_patient_id_for_tumour helper. A pair with no Class II typing available
            # (file doesn't exist, or mhc_hammer isn't even part of this runner) still gets a
            # Class-I-only pvacseq run rather than failing outright.
            # results/unix_group to be prepended to this in snakefile
            hla2_alleles: "mhc_hammer-1.0/99-outputs/hla2_alleles/{seq_type}--{genome_build}/{patient_id}.hla2_alleles.csv"

            # Same options/inputs key-split precedent as modules/mhc_hammer/1.0's own
            # inputs.vep_cache -- reference data, not a tool/script path.
            vep_cache: "/projects/rmorin/reference/ensembl_vep_cache/"

        scratch_subdirectories: []

        options:
            # Module-owned scripts -- same {MODSDIR}/src/ convention as modules/mhc_hammer/1.0's
            # own options.hla2_parse_script/options.mutations_to_maf_script.
            maf_coding_positions_script: "{MODSDIR}/src/maf_coding_positions.py"
            prepare_allele_list_script: "{MODSDIR}/src/prepare_allele_list.py"
            join_neoantigen_maf_script: "{MODSDIR}/src/join_neoantigen_maf.py"

            # Reused directly from modules/vcf2maf/1.3 -- NOT a copy. This is the exact same
            # CrossMap-based MAF coordinate-lift script that module's own _vcf2maf_crossmap rule
            # uses (confirmed by reading vcf2maf.smk directly), reused here for
            # _pvactools_crossmap_neoantigen_maf so both modules stay lifting-behaviour-identical
            # with zero duplicated logic.
            convert_coord_script: "{SCRIPTSDIR}/crossmap/1.1/convert_maf_coords.sh"

            # Path to the directory containing the vep executable; auto-detected from PATH if
            # empty. Same options.vep_path precedent as modules/mhc_hammer/1.0 and
            # modules/vcf2maf/1.3 -- VEP is user-supplied, not conda-managed, to avoid the
            # bioconda/Perl solver conflicts already hit with ensembl-vep in the vcf2maf module.
            vep_path: "/projects/rmorin_scratch/conda_environments/f816977f06ed42b54bf471f1bb26c3b0_/bin"

            # Recommended (not required) by pVACtools' own docs to control VEP runtime -- restricts
            # annotation to one transcript per variant.
            vep_pick: True

            # genome_build -> VEP's own -assembly argument. Real, confirmed requirement (not just
            # tidiness): a real run against a shared cache directory holding both GRCh37 and GRCh38
            # under the same VEP cache version failed with "ERROR: Multiple assemblies found for
            # cache version 105 (GRCh38, GRCh37) - specify one using --assembly [assembly]". Mirrors
            # modules/vcf2maf/1.3's own VCF2MAF_VERSION_MAP transform ("grch" -> "GRCh") -- extend
            # with any other genome_build values your samples table uses (e.g. hs37d5 -> GRCh37).
            vep_assembly_map:
                grch37: "GRCh37"
                hs37d5: "GRCh37"
                hg38: "GRCh38"
                # Same underlying coordinate system as grch37/hs37d5 -- "clc" refers to the
                # alignment tool (CLC Genomics Workbench) that produced this reference/BAM, not a
                # different genome build. Real value hit on a real genome-cohort run (2026-09).
                hg19-clc: "GRCh37"
                hg19-clc-other: "GRCh37"

            # Protein-altering MAF classes only -- reused as-is from vcf2maf's own earlier
            # VEP-derived Variant_Classification, so no redundant re-annotation/re-scoring is spent
            # on variants already known to be silent/non-coding (the large majority for a WGS
            # sample). Splice_Site is deliberately EXCLUDED: splice-derived neoepitopes are
            # pVACsplice's job, out of scope for this pVACseq-only module.
            coding_variant_classifications:
                - "Missense_Mutation"
                - "Nonsense_Mutation"
                - "Frame_Shift_Ins"
                - "Frame_Shift_Del"
                - "In_Frame_Ins"
                - "In_Frame_Del"
                - "Nonstop_Mutation"
                - "Translation_Start_Site"

            # Optional. Local IEDB installation directory (--iedb-install-directory), needed only
            # for IEDB-mediated algorithms (NetMHCpan, NetMHCIIpan, etc. -- see
            # options.iedb_gated_algorithms below). Free for academic use but requires a manual,
            # license-gated download -- same shape as this repo's own options.novoalign_dir/
            # options.hlahd_dir pattern (modules/mhc_hammer/1.0). Left empty, only the fully
            # ungated algorithms in options.prediction_algorithms below are usable.
            iedb_install_directory: ""

            # Every algorithm in this list is rejected at config-parse time unless
            # options.iedb_install_directory is set -- fail fast rather than a confusing pvacseq
            # runtime error. Only NetMHCpan/NetMHCIIpan confirmed IEDB-mediated this session; add to
            # this list as more are confirmed (BigMHC/DeepImmuno/MixMHCpred/MixMHC2pred/PRIME/
            # TL-MHC also need separate manual installs per pVACtools' own docs, not yet confirmed
            # to specifically be IEDB-mediated rather than their own standalone installs).
            iedb_gated_algorithms:
                - "NetMHCpan"
                - "NetMHCpanEL"
                - "NetMHCIIpan"
                - "NetMHCIIpanEL"
                - "NetMHC"
                - "NetMHCcons"
                - "PickPocket"
                - "SMM"
                - "SMMPMBEC"
                - "SMMalign"
                - "NNalign"

            # Fully ungated (pip/bioconda-installable, no license/registration) default set,
            # confirmed via a real installed pvactools=7.1.3: MHCflurry/MHCflurryEL (Class I) and
            # MHCnuggetsI (Class I) / MHCnuggetsII (Class II). MHCnuggets ships its trained models
            # bundled in the package (confirmed: mhcnuggets/saves/production/*.h5) -- no download
            # step needed. MHCflurry needs a one-time `mhcflurry-downloads fetch` (see
            # _pvactools_download_mhcflurry_models in pvactools.smk).
            prediction_algorithms:
                - "MHCflurry"
                - "MHCflurryEL"
                - "MHCnuggetsI"
                - "MHCnuggetsII"

            # -e1/-e2. Real confirmed defaults from a real `pvacseq run --help` (pvactools=7.1.3).
            class_i_epitope_lengths: "8,9,10,11"
            class_ii_epitope_lengths: "12,13,14,15,16,17,18"

            # -b/-m. Real confirmed defaults from `pvacseq run --help`.
            binding_threshold: 500
            top_score_metric: "median"

            # EXPERIMENTAL diagnostic knob, null (unset) by default -- NOT a default-on fix. Set to
            # a fraction in (0, 1] to pass `--tumor-purity` on every pvacseq run in this cohort.
            # `--tumor-purity` ONLY feeds pvacseq's own `vaf_clonal` estimate, used solely for the
            # aggregated report's own Tier/Subclonal *labels* -- it has no effect on filtered.tsv
            # membership at all (that's options.tdna_vaf below, entirely independent -- an earlier
            # version of this rule derived --tdna-vaf from this value, coupling the two; reverted
            # after a real, requested correction -- see options.tdna_vaf's own comment for why).
            # Real, data-confirmed motivation for this option existing at all (this module's own
            # CHANGELOG): pvacseq's own default "crude" purity estimate, used when this is left
            # unset, is a single-outlier-sensitive heuristic (the largest observed DNA VAF under 0.6,
            # capped at 0.5) that can badly overestimate purity for a sample whose true clonal VAF
            # cluster sits well below 0.5, making the aggregated report's own Tier labels
            # correspondingly unreliable. A single global value here is a blunt, cohort-wide
            # experimental override -- not a per-sample purity estimate.
            assumed_purity: null

            # Fixed technical minimum Tumor DNA VAF passed to pvacseq's own `--tdna-vaf`
            # (coverage_filter's hard threshold on whether a variant survives into filtered.tsv at
            # all) -- applied unconditionally, on every run, regardless of whether assumed_purity is
            # set. Deliberately NOT derived from assumed_purity/vaf_clonal (an earlier version of
            # this rule did exactly that -- reverted, real, requested correction): `--tdna-vaf` and
            # `--tumor-purity` serve genuinely different purposes and coupling them was wrong.
            # `--tumor-purity` only informs pvacseq's own VAF-based clonality estimate used for
            # aggregate-report tiering; `--tdna-vaf` is independently configured here as a technical
            # minimum for retaining somatic variants at all. Raw tumour DNA VAF alone is not a
            # reliable clonality estimator (it also depends on tumour purity, copy number, mutant
            # multiplicity, LOH, and sampling variance), so this pipeline intentionally does NOT use
            # pvacseq's own clonality heuristic as a hard neoantigen-exclusion criterion. Default
            # 0.05 (well below pvacseq's own stock default of 0.25) is intended to retain credible
            # lower-VAF/subclonal variants for downstream neoantigen analysis -- real motivation for
            # our lymphoma/WGS use case, where subclonal mutations should remain available rather
            # than being silently dropped from filtered.tsv. Tier labels (including "Subclonal") are
            # never used anywhere in this module to discard a candidate outright -- see
            # _pvactools_run's own comment in pvactools.smk.
            tdna_vaf: 0.05

            # Neoantigen MAF feature (_pvactools_join_neoantigen_maf/_pvactools_crossmap_neoantigen_maf)
            # -- see this module's CHANGELOG for the full design reasoning, including the approaches
            # tried and rejected before landing on this one. Produces one small, MAF-shaped file per
            # pair (this MAF's own first N columns plus the pvactools columns below), one row per
            # pvactools-predicted mutation, in a single cohort-wide harmonized genome build -- NOT a
            # cohort-wide concatenation (that's left to your own downstream MAF-merging tooling).

            # Literally the first N columns of the real MAF header (not a hand-picked column list),
            # matching the "minimal MAF" convention this was requested to match.
            minimal_maf_columns: 45

            # pvactools' own aggregated-report columns to carry through onto the minimal MAF above.
            # RNA Expr/RNA VAF/RNA Depth/Allele Expr are always "NA" today (this module is DNA-only,
            # see README) but kept here anyway, per explicit request, so this table's own schema
            # doesn't need to change again once RNA support lands.
            neoantigen_maf_columns:
                - "Tier"
                - "Best Peptide"
                - "Allele"
                - "IC50 MT"
                - "Pres %ile MT"
                - "DNA VAF"
                - "RNA Expr"
                - "RNA VAF"
                - "RNA Depth"
                - "Allele Expr"

            # Configurable combined pass/fail filtering for the neoantigen MAF -- each key here
            # becomes its own new column (named exactly by that key) in the output, holding "True"/
            # "False" for whether that row passes the given preset's own combined criteria. Add,
            # remove, or rename presets freely -- no code change needed, same "as many as you want"
            # convention as options.additional_filters. Fixed criteria (deliberately not a generic
            # rule engine, matching this module's own established config-driven-thresholds style):
            #   binding_threshold                  -- max "IC50 MT" (pvacseq's own -b units)
            #   presentation_percentile_threshold  -- max "Pres %ile MT"
            #   min_dna_vaf                        -- min "DNA VAF" (this module's own tdna_vaf
            #                                          philosophy -- pvacseq's own binding_filter,
            #                                          which Pvacseq_Pass_Relaxed/VeryRelaxed above
            #                                          reflect, never looks at DNA VAF at all)
            #   excluded_tiers                      -- list of aggregated-report Tier values to
            #                                          reject (default []: no Tier-based exclusion
            #                                          at all -- "Subclonal" is deliberately never
            #                                          excluded by default, see this module's own
            #                                          CHANGELOG for why raw VAF/Tier alone isn't a
            #                                          reliable clonality signal)
            # Omit any key entirely to skip that criterion for a given preset. A criterion is a real
            # numeric comparison -- only a genuinely missing ("NA") value auto-passes it, matching
            # pvactools' own Filter.execute() convention (confirmed directly from its source earlier
            # this session) rather than inventing a stricter rule this module doesn't use elsewhere.
            neoantigen_pass_filters:
                Neoantigen_Pass_Standard:
                    binding_threshold: 500
                    presentation_percentile_threshold: 2.0
                    min_dna_vaf: 0.05

            # Single, cohort-wide target build for the neoantigen MAF's harmonized coordinates --
            # NOT a per-pair wildcard (confirmed with the user: one oncoplot wants one shared
            # coordinate system). Lowercase "grch37"/"grch38", matching modules/vcf2maf/1.3's own
            # internal genome "version" convention. Only grch37<->grch38 lifting is supported,
            # mirroring that module's own CrossMap chain-pairing limitation (hg19/hg38 chains only)
            # -- a pair whose native build is already this version needs no lift at all.
            neoantigen_target_build: "grch37"

            # Additional standard filterings of pvacseq's own combined all_epitopes.tsv, run via
            # `pvacseq binding_filter` followed by `pvacseq top_score_filter` -- both pure
            # post-processing on already-computed scores (confirmed by reading pvactools' own
            # lib/binding_filter.py/lib/top_score_filter.py directly: no model/IEDB calls at all),
            # so these cost essentially nothing beyond the primary pvacseq run itself. Filtering
            # first and collapsing to one row per mutation second (the reverse of pvacseq's own
            # internal run order) is deliberate -- see _pvactools_apply_additional_filter's own
            # comment in pvactools.smk and this module's CHANGELOG for why.
            #
            # Motivated by a real observation: pvacseq's own
            # default filtered.tsv (using "conservative" strategy -- a candidate must pass ALL of
            # binding score/binding percentile/presentation percentile simultaneously) left several
            # real samples with very few or zero surviving candidates, likely a combination of
            # DLBCL's generally modest TMB and that three-way-AND requirement being genuinely
            # strict. Each key here becomes a "{filter_preset}/*.filtered.tsv" file under
            # 99-outputs/additional_filters/ -- add/remove/rename presets freely, no code change
            # needed. binding_threshold/binding_percentile_threshold/presentation_percentile_threshold
            # match pvacseq's own -b/--binding-percentile-threshold/--presentation-percentile-threshold.
            #
            # percentile_threshold_strategy is ALWAYS "conservative" below, deliberately --
            # confirmed via a real test against pvactools' own binding_filter that "exploratory"
            # (--percentile-threshold-strategy exploratory) is a silent no-op for our algorithm
            # selection: it only excludes a row if it fails ALL FOUR criteria (binding score/
            # binding percentile/presentation percentile/immunogenicity percentile)
            # simultaneously, but immunogenicity percentile is always "NA" for us (none of
            # MHCflurry/MHCflurryEL/MHCnuggetsI/MHCnuggetsII compute it -- that needs DeepImmuno or
            # ImmuScope_IM, which we don't run), and pvactools treats "NA" as automatically NOT
            # failing -- so that one always-NA column alone is enough to keep every row regardless
            # of how poor its other three scores are. Confirmed directly: a synthetic row failing
            # all three real criteria (IC50 1000 > 500, percentile 5.0 > 2.0, presentation
            # 5.0 > 2.0) still survived "exploratory" filtering intact. If DeepImmuno/ImmuScope_IM
            # are ever added to options.prediction_algorithms, this would need revisiting --
            # exploratory mode would become meaningful again once immunogenicity percentile is
            # actually populated.
            additional_filters:
                relaxed:
                    # ~2x pvacseq's own default numeric cutoffs.
                    binding_threshold: 1000
                    binding_percentile_threshold: 5.0
                    presentation_percentile_threshold: 5.0
                    percentile_threshold_strategy: "conservative"
                very_relaxed:
                    # A much broader net -- most useful for exploratory prioritization work (e.g.
                    # manually reviewing near-misses) rather than a high-confidence shortlist.
                    binding_threshold: 5000
                    binding_percentile_threshold: 20.0
                    presentation_percentile_threshold: 20.0
                    percentile_threshold_strategy: "conservative"

            # MHCflurry release to fetch (mhcflurry-downloads fetch --release). Confirmed via a
            # real run: pointing MHCFLURRY_DOWNLOADS_DIR at a fresh/custom directory disables
            # mhcflurry's own default-release auto-detection ("No release defined"), so this must be
            # passed explicitly. Real current default confirmed via `mhcflurry-downloads info`.
            mhcflurry_release: "2.0.0"

        conda_envs:
            # Real confirmed real gotcha (pvactools=7.1.3, 2026-09): mhcflurry's own
            # `mhcflurry-downloads` command imports the deprecated `pkg_resources` API
            # (`ModuleNotFoundError: No module named 'pkg_resources'` on a plain pip install with a
            # modern setuptools) -- setuptools removed pkg_resources entirely as of the deprecation
            # date this same warning cites (2025-11-30, already past). `setuptools<81` is pinned
            # below specifically to keep `mhcflurry-downloads fetch` working; confirmed this fixes
            # it on a real local install.
            pvactools: "{MODSDIR}/envs/pvactools-7.1.3.yaml"
            bcftools: "{MODSDIR}/envs/bcftools-1.10.2.yaml"
            # Reused directly from modules/vcf2maf/1.3 -- same env file, not a copy, so
            # _pvactools_crossmap_neoantigen_maf stays CrossMap-version-identical to that module's
            # own _vcf2maf_crossmap rule.
            crossmap: "{SCRIPTSDIR}/crossmap/1.1/convert_maf_coords.yaml"

        threads:
            download_mhcflurry: 1
            install_vep_plugins: 1
            subset_coding_variants: 1
            vep_annotate: 4
            prepare_allele_list: 1
            pvacseq_run: 8
            join_neoantigen_maf: 1
            crossmap_neoantigen_maf: 1

        resources:
            download_mhcflurry:
                mem_mb: 2000
            install_vep_plugins:
                mem_mb: 2000
            subset_coding_variants:
                mem_mb: 2000
            vep_annotate:
                mem_mb: 8000
            prepare_allele_list:
                mem_mb: 1000
            pvacseq_run:
                mem_mb: 16000
            join_neoantigen_maf:
                mem_mb: 1000
            crossmap_neoantigen_maf:
                mem_mb: 2000

        pairing_config:
            capture:
                run_paired_tumours: True
                run_unpaired_tumours_with: null
                run_paired_tumours_as_unpaired: False
            genome:
                run_paired_tumours: True
                run_unpaired_tumours_with: null
                run_paired_tumours_as_unpaired: False
